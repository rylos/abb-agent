[package]
name = "abb-restore"
version = "0.2.13"
edition.workspace = true
license.workspace = true
description = "Bare-metal restore from Synology Active Backup for Business, for any Linux live system"

[dependencies]
abb-proto.workspace = true
btrfs-image.workspace = true
crossterm = "0.28"
libc = "0.2"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde_json = "1"
