[package]
name = "btrfs-image"
version = "0.2.9"
edition.workspace = true
license.workspace = true
description = "Read-only access to btrfs from the raw device: map of used blocks and an image consistent with one generation"

[dependencies]
crc32c = "0.6"
libc = "0.2"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
