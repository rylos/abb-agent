# abb-agent configuration. Every setting is optional: the values shown are the defaults.
# Apply changes with `systemctl restart abb-agent`; `abb-agent config` shows the
# configuration in effect.
#
# The server connection (address, token, certificate fingerprint) is not configured here:
# `abb-agent connect` creates it in /var/lib/abb-agent.

# Disks the agent may back up. Each disk becomes one image on the server with its partition
# table, so it can be restored bare-metal. Which volumes of them are sent depends on the task's
# source type in the console.
# Name them so that they are found again if the kernel numbers disks differently (nvme0n1 and
# nvme1n1 can swap between boots or kernels):
#   "system"                          the disk holding /
#   "/dev/disk/by-id/nvme-Samsung…"   a stable device path (`ls -l /dev/disk/by-id`)
#   "nvme0n1"                         a kernel name (only if it never changes)
# Each disk keeps the image name it was first backed up under, whatever the kernel calls it later.
# Empty: all internal disks (not removable, not USB, not virtual).
disks = []

[schedule]
# The schedule, backup window, source (whole device, system volumes or selected volumes),
# bandwidth limit and pre/post scripts are set on the task in the ABB console, and the agent
# follows them. The settings below add what the console does not offer for Linux.
#
# Back up once after every boot, as soon as the server is reachable.
on_boot = true
# Back up every N hours in addition to the console schedule (0 = never).
interval_hours = 0
# Minutes before retrying a failed backup (0 = do not retry).
retry_minutes = 60
# Lock files to wait for before starting, so that other backup jobs do not run at the same
# time (abb-agent takes an exclusive flock on each). Missing files are ignored.
# Example: wait_locks = ["/run/lock/backup-nas.lock"]
wait_locks = []

[btrfs]
# Subvolumes to leave out of the image, as paths from the top-level subvolume (`*` and `?`
# allowed). In the restored system they no longer exist: btrfs removes them on the first mount.
# Their data is not sent unless other subvolumes (e.g. snapshots of them) still use it, so list
# those snapshots too. Subvolumes nested inside an excluded one are excluded with it.
# Example: exclude_subvolumes = ["@games", "btrbk_snapshots/@games.*"]
exclude_subvolumes = []

[ext]
# ext2/3/4 filesystems mounted read-write cannot be imaged consistently without a snapshot.
# false: they are skipped and the backup is reported as partial.
# true: they are frozen (fsfreeze) from the start of the backup until the upload ends, so
# writers to them block meanwhile. Never applied to filesystems holding /, /var or /tmp.
freeze_mounted = false

[performance]
# Threads that read, verify and compress data (0 = one per CPU, at most 8).
workers = 0

[hooks]
# Shell commands (run as root with /bin/sh, at most 5 minutes each). on_finish gets
# ABB_STATUS (complete, partial, error or cancel) and ABB_EXIT (0 only when complete).
# Example, a healthchecks.io check:
#   on_start = "curl -fsS -m 10 --retry 5 -o /dev/null https://hc-ping.com/<uuid>/start"
#   on_finish = "curl -fsS -m 10 --retry 5 -o /dev/null https://hc-ping.com/<uuid>/$ABB_EXIT"
on_start = ""
on_finish = ""
